{% extends "base.html" %}

{% block content %}
<div class="order-container">
    <h2>Confirm Your Order</h2>
    
    {% if error %}
        <div style="background: rgba(220, 53, 69, 0.3); border: 1px solid rgba(220, 53, 69, 0.5); color: #ff6b6b; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
            {{ error }}
        </div>
    {% endif %}
    
    <div class="product-details">
        <h3>{{ product.name }}</h3>
        <p><strong>Price:</strong> ₹{{ product.price }}</p>
        <p><strong>Description:</strong> {{ product.description }}</p>
    </div>

    <form method="POST" class="order-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="mobile">Mobile Number:</label>
            <input type="text" id="mobile" name="mobile" required>
        </div>

        <div class="form-group">
            <label for="address">Address:</label>
            <textarea id="address" name="address" required></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="app-buy-btn" id="confirmOrderBtn" style="width: 100%; margin-top: 20px; padding: 12px; font-size: 16px; cursor: pointer;">Confirm Order</button>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <a href="{% url 'home' %}" class="app-action-btn" style="flex: 1; text-align: center; display: inline-block;">Home</a>
                <a href="{% url 'cart' %}" class="app-action-btn" style="flex: 1; text-align: center; display: inline-block;">Cart</a>
            </div>
        </div>
    </form>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('.order-form');
            const btn = document.getElementById('confirmOrderBtn');
            
            if (form) {
                form.addEventListener('submit', function(e) {
                    console.log('Form submitted');
                    // Validate form fields
                    const name = document.getElementById('name').value.trim();
                    const mobile = document.getElementById('mobile').value.trim();
                    const address = document.getElementById('address').value.trim();
                    
                    if (!name || !mobile || !address) {
                        e.preventDefault();
                        alert('Please fill in all fields');
                        return false;
                    }
                    console.log('Form validation passed, submitting...');
                });
            }
        });
    </script>
</div>

<style>
    .order-container {
        max-width: 500px;
        margin: 40px auto;
        padding: 30px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .order-container h2 {
        text-align: center;
        color: #fff;
        margin-bottom: 30px;
        font-size: 28px;
    }

    .product-details {
        background: rgba(255, 255, 255, 0.05);
        padding: 20px;
        margin-bottom: 30px;
        border-radius: 5px;
        border-left: 4px solid #28a745;
    }

    .product-details h3 {
        margin-top: 0;
        color: #fff;
        margin-bottom: 15px;
    }

    .product-details p {
        margin: 8px 0;
        color: rgba(255, 255, 255, 0.8);
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #fff;
        font-weight: 600;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        font-size: 14px;
        background: #333;
        color: #fff;
        box-sizing: border-box;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
        color: rgba(255, 255, 255, 0.5);
    }

    .form-group input:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #28a745;
        box-shadow: 0 0 8px rgba(40, 167, 69, 0.3);
    }

    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }

    .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 30px;
        align-items: center;
    }
</style>

{% endblock %}
